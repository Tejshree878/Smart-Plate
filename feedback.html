<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback | Smart Plate</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fae9b7;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4CAF50;
      color: white;
      text-align: center;
      padding: 20px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .back-button {
        background-color: #28a745;
        position: absolute;
        left: 10px;
        top: 45px;
    }

    .back-button:hover {
        background-color: #218838;
    }

    .back-button, h1 {
        display: inline-block;
    }

    .container {
      max-width: 600px;
      background: white;
      margin: 50px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }

    h2 {
      color: #2e7d32;
      margin-bottom: 20px;
      text-align: center;
    }

    form label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #e0e0e0;
      margin-top: 50px;
      font-size: 0.9rem;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>

  <header>
    <button class="back-button" onclick="goBack()">← Back</button>
    <h1>Feedback – Smart Plate</h1>
  </header>

  <div class="container">
    <h2>We’d love to hear from you!</h2>
    <form action="mailto:smartplate.team@email.com" method="post" enctype="text/plain">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required />

      <label for="feedback">Your Feedback</label>
      <textarea id="feedback" name="feedback" required></textarea>

      <button type="submit">Submit Feedback</button>
    </form>
  </div>

  <footer>
    &copy; 2025 Smart Plate | We appreciate your feedback!
  </footer>

</body>
</html>
