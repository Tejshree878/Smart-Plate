<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fae9b7;
            margin: 0;
            padding: 80px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            background: #e9ecef;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 3px;
        }
        .low-stock {
            background: yellow;
        }

        .back-button {
            background-color: #28a745;
            position: absolute;
            left: 10px;
            top: 45px;
        }

        .back-button:hover {
            background-color: #218838;
        }

        .back-button, h1 {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒Grocery Manager</h1>
        <h3>Keep track of your grocery list easily!</h3>
        <button class="back-button" onclick="goBack()">← Back</button>
        <div class="input-section">
            <input type="text" id="item-name" placeholder="Enter grocery item">
            <input type="number" id="item-quantity" placeholder="Quantity" min="1">
            <select id="item-category">
                <option value="Fruits">Fruits</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Dairy">Dairy</option>
                <option value="Grains">Grains</option>
                <option value="Others">Others</option>
            </select>
            <button onclick="addItem()">Add Item</button>
        </div>
        <ul id="grocery-list"></ul>
    </div>
    <script>
        function addItem() {
            let name = document.getElementById("item-name").value;
            let quantity = document.getElementById("item-quantity").value;
            let category = document.getElementById("item-category").value;
            
            if (name === "" || quantity === "") {
                alert("Please enter both item name and quantity");
                return;
            }
            
            let list = document.getElementById("grocery-list");
            let li = document.createElement("li");
            li.classList.add("grocery-item");
            if (quantity < 2) {
                li.classList.add("low-stock");
            }
            
            li.innerHTML = `${name} - ${quantity} (${category}) <button class='delete-btn' onclick='removeItem(this)'>Delete</button>`;
            
            list.appendChild(li);
            
            document.getElementById("item-name").value = "";
            document.getElementById("item-quantity").value = "";
        }
        
        function removeItem(button) {
            button.parentElement.remove();
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
